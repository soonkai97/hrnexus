version: 2
updates:
  - package-ecosystem: nuget
    directories: ["/backend/src/*", "/backend/tests/*"]
    schedule: { interval: weekly }
    commit-message: { prefix: "build(deps)" }
    ignore:
      # MediatR 13 and later are commercial; stay on 12.x until the dispatcher swap (phase 12d).
      - dependency-name: "MediatR"
        update-types: ["version-update:semver-major"]
      # Swashbuckle is replaced or reworked in the API-contract phase (7e).
      - dependency-name: "Swashbuckle.AspNetCore"
        update-types: ["version-update:semver-major"]
      # Stay on the .NET 10 LTS: no 11.x framework packages.
      - dependency-name: "Microsoft.Extensions.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.EntityFrameworkCore*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.AspNetCore.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "System.*"
        update-types: ["version-update:semver-major"]
      # Backend major upgrades are their own phase, one package family at a time.
      - dependency-name: "Serilog.AspNetCore"
        update-types: ["version-update:semver-major"]
      - dependency-name: "FluentValidation*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "OpenTelemetry*"
        update-types: ["version-update:semver-major"]
    groups:
      # One pull request per week for all .NET packages instead of one per package per project.
      dotnet: { patterns: ["*"] }
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    commit-message: { prefix: "build(deps)" }
    ignore:
      # Stay on Angular 21: Angular 22 needs PrimeNG 22, which is published by PrimeUI and shows an
      # 'Invalid PrimeUI License' badge unless a license is configured. PrimeNG 21 stays MIT.
      - dependency-name: "@angular/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "primeng"
        update-types: ["version-update:semver-major"]
      - dependency-name: "primeicons"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@primeuix/*"
        update-types: ["version-update:semver-major"]
      # Tooling that moves with the Angular major (angular-eslint 22, ng-packagr 22, TypeScript 6).
      - dependency-name: "angular-eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@angular-eslint/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "ng-packagr"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # vitest 5 and jsdom 31 are held with the Angular major until the test stack is re-checked.
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitest/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "jsdom"
        update-types: ["version-update:semver-major"]
      # ngx-translate is removed in the English-only phase (7i), so do not upgrade it.
      - dependency-name: "@ngx-translate/*"
        update-types: ["version-update:semver-major"]
    groups:
      angular: { patterns: ["@angular/*", "@angular-devkit/*", "@angular-eslint/*"] }
      primeng: { patterns: ["primeng", "@primeng/*", "primeicons"] }
      testing: { patterns: ["vitest*", "@vitest/*", "@playwright/*", "playwright*", "jsdom"] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    commit-message: { prefix: "build(deps)" }
  - package-ecosystem: docker
    directories: ["/backend", "/nginx"]
    schedule: { interval: monthly }
    commit-message: { prefix: "build(deps)" }
    ignore:
      # Stay on the .NET 10 LTS line; .NET 11 is short-term support.
      - dependency-name: "dotnet/sdk"
        update-types: ["version-update:semver-major"]
      - dependency-name: "dotnet/aspnet"
        update-types: ["version-update:semver-major"]
      # Stay on an even-numbered Node LTS line; odd majors are not LTS.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
