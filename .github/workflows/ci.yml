name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build-and-test:
    name: Build & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint — fails on errors, warnings allowed)
        run: npm run lint

      - name: Build shared-lib
        run: npx ng build shared-lib --configuration production

      - name: Build admin-app
        run: npx ng build admin-app --configuration production

      - name: Build staff-app
        run: npx ng build staff-app --configuration production

      - name: Unit tests — shared-lib
        run: npm run test:shared

      - name: Unit tests — admin-app
        run: npm run test:admin

      - name: Unit tests — staff-app
        run: npm run test:staff

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  backend:
    name: Backend Build & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore backend/HRNexus.sln

      # --configuration Release with the analyzers enabled: unused usings (IDE0005) and unused
      # locals/fields fail the build here, same as locally.
      - name: Build
        run: dotnet build backend/HRNexus.sln --no-restore --configuration Release

      # Integration.Tests spins up a throwaway PostgreSQL via Testcontainers — Docker is available
      # on ubuntu-latest, so the full suite (Application + Integration + Infrastructure) runs.
      - name: Test
        run: dotnet test backend/HRNexus.sln --no-build --configuration Release --verbosity minimal

  # E2E tests require Docker infrastructure — run separately on push to main only
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    needs: build-and-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Start Docker stack
        run: docker compose up -d --wait
        timeout-minutes: 5

      - name: Run E2E tests — admin
        run: npm run test:e2e:admin

      - name: Run E2E tests — staff
        run: npm run test:e2e:staff

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
