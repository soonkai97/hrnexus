name: Deploy

# MANUAL production deploy. There is no automatic deploy on merge, push or tag.
#
# What it does: verifies that the current tip of master passed CI, then SSHes to the droplet and runs ./deploy.sh
# (which pulls master, rebuilds the Docker images with --no-cache, switches maintenance mode on/off and waits for healthy
# containers). deploy.sh runs `git pull`, so this workflow can only deploy the tip of master, never an older commit.
#
# Approval gate: the job uses the GitHub environment "production". In GitHub -> Settings -> Environments -> production:
#   - add "Required reviewers" (yourself): every run then waits for your approval before any step runs
#   - "Deployment branches and tags": restrict to master
#   - add the environment secrets and variable listed below (never commit real values)
#
# Environment secrets:   DEPLOY_HOST (hostname or IP), DEPLOY_USER (ssh user), DEPLOY_SSH_KEY (private key, a dedicated
#                        deploy key), DEPLOY_KNOWN_HOSTS (the output of `ssh-keyscan -t ed25519 <host>`, checked strictly)
# Environment variables: DEPLOY_PATH (repo path on the server, for example /root/hrnexus),
#                        DEPLOY_HEALTH_URL (public health URL checked after the deploy, the /api/health endpoint)

on:
  workflow_dispatch:
    inputs:
      service:
        description: What to rebuild and restart (web = Angular + nginx, api = .NET API, all = both)
        type: choice
        options: [web, api, all]
        default: web
      backup_confirmed:
        description: I took a fresh database backup (required when the release contains an EF migration)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - name: Require a confirmed backup
        env:
          BACKUP_CONFIRMED: ${{ inputs.backup_confirmed }}
        run: |
          if [ "$BACKUP_CONFIRMED" != "true" ]; then
            echo "::error::Tick backup_confirmed: take a database backup first (scripts/backup-db.sh on the server)."; exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: master
          persist-credentials: false

      - name: Verify CI passed for the tip of master
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          passed=$(gh run list --repo "$REPO" --workflow CI --commit "$sha" --status success --json databaseId --jq length)
          if [ "$passed" -lt 1 ]; then
            echo "::error::No successful CI run for master at $sha. Wait for CI, then run this workflow again."; exit 1
          fi
          echo "Deploying master at $sha" >> "$GITHUB_STEP_SUMMARY"
          echo "DEPLOY_SHA=$sha" >> "$GITHUB_ENV"

      - name: Prepare the SSH key and known_hosts
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$RUNNER_TEMP/ssh/id"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$RUNNER_TEMP/ssh/known_hosts"

      - name: Run deploy.sh on the server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          SERVICE: ${{ inputs.service }}
        run: |
          set -euo pipefail
          case "$SERVICE" in web|api|all) ;; *) echo "::error::Unknown service"; exit 1 ;; esac
          # Values reach the remote shell as positional arguments of a fixed script, never spliced into command text.
          ssh -i "$RUNNER_TEMP/ssh/id" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" -o BatchMode=yes \
              "$DEPLOY_USER@$DEPLOY_HOST" bash -s -- "$DEPLOY_PATH" "$DEPLOY_SHA" "$SERVICE" <<'REMOTE'
          set -euo pipefail
          cd "$1"
          git fetch origin master
          if [ "$(git rev-parse origin/master)" != "$2" ]; then
            echo "master moved after CI was verified ($2); run the workflow again."; exit 1
          fi
          if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
            echo "The server working tree has local changes; refusing to deploy."; exit 1
          fi
          git checkout master
          ./deploy.sh "$3"
          REMOTE

      - name: Remove the SSH key
        if: always()
        run: rm -rf "$RUNNER_TEMP/ssh"

      - name: Health check
        env:
          HEALTH_URL: ${{ vars.DEPLOY_HEALTH_URL }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 10 --retry-delay 6 --retry-all-errors "$HEALTH_URL"
          echo
          echo "Deploy finished and the health check passed. Hard-refresh the browser (Ctrl+Shift+R)." >> "$GITHUB_STEP_SUMMARY"
