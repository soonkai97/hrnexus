name: E2E (Playwright)

# Browser end-to-end tests are slow and touch every layer, so they never run on pull requests: start them by hand
# (Actions tab -> E2E (Playwright) -> Run workflow) or wait for the weekly run. They run against the real docker compose
# stack (docker-compose.yml only, no UAT overlay): web app :8080.
# The stack uses the compose file's throw-away development defaults (database password, JWT secret) and the seeded
# HRADMIN account; the runner and everything on it are gone when the job ends. Nothing here is a real secret.

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1" # Mondays, 03:17 UTC

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    name: Playwright (Chromium) against the docker compose stack
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Playwright and Chromium
        run: npx playwright install --with-deps chromium

      - name: Start the docker compose stack
        run: docker compose up -d --build --wait
        timeout-minutes: 20

      - name: Run the E2E scenarios
        run: npm run test:e2e

      - name: Docker logs
        if: failure()
        run: docker compose logs --no-color --tail=300

      - name: Upload the HTML report, traces and screenshots
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: e2e-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Stop the stack
        if: always()
        run: docker compose down -v
