name: Release

# Tag-driven GitHub release. Push a tag like v1.2.0 (or v1.2.0-rc.1 for a pre-release) on a commit that is on master AND
# whose CI run succeeded; the workflow then creates the GitHub Release with generated notes. It publishes no image and
# deploys nothing: production is deployed by the manual "Deploy" workflow. Uses the built-in GITHUB_TOKEN, no stored secrets.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write   # create the release
      actions: read     # look up the CI run of this commit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify the tagged commit is on master and CI passed
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin master
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "::error::Tag $GITHUB_REF_NAME is not on master. Releases are cut from master only."; exit 1
          fi
          passed=$(gh run list --repo "$REPO" --workflow CI --commit "$GITHUB_SHA" --status success --json databaseId --jq length)
          if [ "$passed" -lt 1 ]; then
            echo "::error::No successful CI run for $GITHUB_SHA. Wait for CI on master, then re-push the tag."; exit 1
          fi

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          flags=""
          case "$TAG" in *-*) flags="--prerelease" ;; esac
          gh release create "$TAG" --repo "$REPO" --verify-tag --title "$TAG" --generate-notes $flags
