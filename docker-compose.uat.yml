# docker-compose.uat.yml — UAT / production environment overrides
#
# Usage (on the server):
#   docker compose -f docker-compose.yml -f docker-compose.uat.yml up -d --build
#
# This overlay:
#   - Exposes ports 80/443 (admin) and 8081/8443 (staff) on the host
#   - Mounts the Let's Encrypt certs from the host into nginx
#   - Rewrites CORS so the API accepts both HTTP and HTTPS origins
#
# Required .env file on the server:
#   DOMAIN=hrnexus.duckdns.org
#   UAT_HOST=hrnexus.duckdns.org
#   JWT_SECRET=<random-long-string-min-32-chars>

services:
  web:
    ports:
      - "80:80"       # admin HTTP  → redirects to HTTPS
      - "443:443"     # admin HTTPS
      - "8081:8081"   # staff HTTP  → redirects to HTTPS
      - "8443:8443"   # staff HTTPS (PWA)
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro   # Let's Encrypt certs from host

  api:
    environment:
      Cors__AllowedOrigins__0: "https://${UAT_HOST}"          # admin HTTPS
      Cors__AllowedOrigins__1: "https://${UAT_HOST}:8443"    # staff HTTPS
      Cors__AllowedOrigins__2: ""
      Cors__AllowedOrigins__3: ""
