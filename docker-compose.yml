name: hrnexus

services:

  # ── PostgreSQL ───────────────────────────────────────────────────────────────
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-hr_nexus}
      POSTGRES_USER:     ${POSTGRES_USER:-ncuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ncpassword}
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ncuser} -d ${POSTGRES_DB:-hr_nexus}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── .NET 10 API ─────────────────────────────────────────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      Jwt__Key: "${JWT_SECRET:-HRNexus_Dev_Secret_Change_In_Production_Min32Chars}"
      Jwt__Issuer: hrnexus
      Jwt__Audience: hrnexus-clients
      Cors__AllowedOrigins__0: "http://admin.${DOMAIN}"
      Cors__AllowedOrigins__1: "http://staff.${DOMAIN}"
      Cors__AllowedOrigins__2: "https://admin.${DOMAIN}"
      Cors__AllowedOrigins__3: "https://staff.${DOMAIN}"
      # Override connection string so the API reaches postgres by service name
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-hr_nexus};Username=${POSTGRES_USER:-ncuser};Password=${POSTGRES_PASSWORD:-ncpassword}"
      # Web Push (VAPID) — generate keys with: npx web-push generate-vapid-keys
      # Leave empty to disable push notifications without breaking anything
      WebPush__Subject: "${VAPID_SUBJECT:-mailto:chiansoonkai97@gmail.com}"
      WebPush__PublicKey: "${VAPID_PUBLIC_KEY:-}"
      WebPush__PrivateKey: "${VAPID_PRIVATE_KEY:-}"
      # Observability (Phase 2) — opt-in, empty by default so logs/traces stay local until enabled.
      # Set SEQ_SERVER_URL=http://seq in .env (and start the 'observability' profile) to ship logs to Seq.
      Seq__ServerUrl: "${SEQ_SERVER_URL:-}"
      Seq__ApiKey: "${SEQ_API_KEY:-}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT:-}"
    volumes:
      - uploads:/app/wwwroot/uploads       # location images
      - logs:/app/logs                     # Serilog files
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ── nginx + Angular apps ─────────────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    restart: unless-stopped
    ports:
      - "8080:80"    # admin app  → http://localhost:8080
      - "8081:8081"  # staff app  → http://localhost:8081
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./maintenance:/tmp/maintenance:ro   # deploy.sh creates/removes 'on' flag here
    depends_on:
      api:
        condition: service_healthy
    networks:
      - internal

  # ── Seq — structured-log / trace sink (OPT-IN) ───────────────────────────────
  # Dormant by default. Enable with:
  #   1) set SEQ_SERVER_URL=http://seq  (and optionally OTEL_EXPORTER_OTLP_ENDPOINT=http://seq/ingest/otlp/v1/traces) in .env
  #   2) docker compose --profile observability up -d
  # Browse the UI at http://localhost:5341. Without the profile, `docker compose up -d` never starts it.
  seq:
    image: datalust/seq:latest
    profiles: ["observability"]
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
    ports:
      - "5341:80"    # Seq UI + ingestion → http://localhost:5341
    volumes:
      - seq_data:/data
    networks:
      - internal

volumes:
  pg_data:
  uploads:
  logs:
  seq_data:

networks:
  internal:
