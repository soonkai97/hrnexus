<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e0a3c"/>
      <stop offset="100%" stop-color="#0d0416"/>
    </linearGradient>
    <linearGradient id="letters1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e879f9"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="glow1">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" fill="url(#bg1)"/>
  <!-- Subtle circle glow -->
  <circle cx="256" cy="220" r="180" fill="#7c3aed" opacity="0.12"/>
  <!-- HR letters -->
  <text x="256" y="300" font-family="Arial Black, Arial, sans-serif" font-weight="900"
        font-size="230" text-anchor="middle" fill="url(#letters1)" filter="url(#glow1)">HR</text>
  <!-- NEXUS label -->
  <text x="256" y="390" font-family="Arial, sans-serif" font-weight="600"
        font-size="56" text-anchor="middle" fill="#7c3aed" letter-spacing="18">NEXUS</text>
</svg>
