<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b"/>
      <stop offset="100%" stop-color="#18061f"/>
    </linearGradient>
    <filter id="neon">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="neonStrong">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" fill="url(#bg3)"/>
  <!-- Outer ring glow -->
  <circle cx="256" cy="240" r="158" fill="none" stroke="#a855f7" stroke-width="3" opacity="0.4" filter="url(#neon)"/>
  <circle cx="256" cy="240" r="158" fill="none" stroke="#a855f7" stroke-width="1.5" opacity="0.8"/>
  <!-- Inner ring -->
  <circle cx="256" cy="240" r="110" fill="none" stroke="#e879f9" stroke-width="1" opacity="0.5" filter="url(#neon)"/>
  <!-- Centre dot -->
  <circle cx="256" cy="240" r="18" fill="#a855f7" filter="url(#neonStrong)"/>
  <circle cx="256" cy="240" r="10" fill="#f0abfc"/>
  <!-- Spoke dots — nexus nodes -->
  <circle cx="256" cy="90" r="10" fill="#e879f9" filter="url(#neon)"/>
  <circle cx="256" cy="90" r="6" fill="white"/>
  <circle cx="256" cy="390" r="10" fill="#e879f9" filter="url(#neon)"/>
  <circle cx="256" cy="390" r="6" fill="white"/>
  <circle cx="106" cy="240" r="10" fill="#e879f9" filter="url(#neon)"/>
  <circle cx="106" cy="240" r="6" fill="white"/>
  <circle cx="406" cy="240" r="10" fill="#e879f9" filter="url(#neon)"/>
  <circle cx="406" cy="240" r="6" fill="white"/>
  <!-- Diagonal nodes -->
  <circle cx="144" cy="128" r="7" fill="#a855f7" opacity="0.9" filter="url(#neon)"/>
  <circle cx="368" cy="128" r="7" fill="#a855f7" opacity="0.9" filter="url(#neon)"/>
  <circle cx="144" cy="352" r="7" fill="#a855f7" opacity="0.9" filter="url(#neon)"/>
  <circle cx="368" cy="352" r="7" fill="#a855f7" opacity="0.9" filter="url(#neon)"/>
  <!-- "N" in centre -->
  <text x="256" y="262" font-family="Arial Black, Arial, sans-serif" font-weight="900"
        font-size="88" text-anchor="middle" fill="white" filter="url(#neon)">N</text>
  <!-- App name bottom -->
  <text x="256" y="468" font-family="Arial, sans-serif" font-weight="600"
        font-size="48" text-anchor="middle" fill="#a855f7" letter-spacing="8">NEXUS</text>
</svg>
