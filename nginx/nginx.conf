events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    gzip          on;
    gzip_types    text/plain text/css application/javascript application/json image/svg+xml;

    upstream api {
        server api:8080;
    }

    # ── Admin app — port 80 (prod: admin.YOURDOMAIN.COM) ─────────────────────
    server {
        listen 80 default_server;
        root /usr/share/nginx/admin;
        index index.html;

        location /api/ {
            proxy_pass         http://api/api/;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        }

        location /hubs/ {
            proxy_pass         http://api/hubs/;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host       $host;
        }

        location /uploads/ {
            proxy_pass http://api/uploads/;
        }

        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
        }

        location ~* /i18n/ {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
        }

        # Hashed static assets — filename changes on every build, safe to cache forever
        location ~* \.[0-9a-f]{8,}\.(js|css)$ {
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }

    # ── Staff app (PWA) — port 8081 (prod: staff.YOURDOMAIN.COM) ─────────────
    server {
        listen 8081 default_server;
        root /usr/share/nginx/staff;
        index index.html;

        location /api/ {
            proxy_pass         http://api/api/;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        }

        location /hubs/ {
            proxy_pass         http://api/hubs/;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host       $host;
        }

        location /uploads/ {
            proxy_pass http://api/uploads/;
        }

        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
        }

        location ~* /i18n/ {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
        }

        # Hashed static assets — filename changes on every build, safe to cache forever
        location ~* \.[0-9a-f]{8,}\.(js|css)$ {
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
