events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile           on;
    client_max_body_size 10m;   # allow photo uploads up to 10 MB
    gzip          on;
    gzip_types    text/plain text/css application/javascript application/json image/svg+xml;

    upstream api {
        server api:8080;
    }

    # ── HTTP → HTTPS redirects ────────────────────────────────────────────────
    server {
        listen 80 default_server;
        return 301 https://$host$request_uri;
    }

    server {
        listen 8081;
        return 301 https://$host:8443$request_uri;
    }

    # ── Admin app — HTTPS 443 ─────────────────────────────────────────────────
    server {
        listen 443 ssl;
        http2 on;
        server_name _;
        root /usr/share/nginx/admin;
        index index.html;

        ssl_certificate     /etc/letsencrypt/live/hrnexus.duckdns.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/hrnexus.duckdns.org/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        add_header Strict-Transport-Security "max-age=31536000" always;

        location /api/ {
            proxy_pass         http://api/api/;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        }

        location /hubs/ {
            proxy_pass         http://api/hubs/;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host       $host;
        }

        location /uploads/ {
            proxy_pass http://api/uploads/;
        }

        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
        }

        location ~* /i18n/ {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
        }

        location ~* "\.[0-9a-f]{8,}\.(js|css)$" {
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }

    # ── Staff app (PWA) — HTTPS 8443 ─────────────────────────────────────────
    server {
        listen 8443 ssl;
        http2 on;
        server_name _;
        root /usr/share/nginx/staff;
        index index.html;

        ssl_certificate     /etc/letsencrypt/live/hrnexus.duckdns.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/hrnexus.duckdns.org/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        add_header Strict-Transport-Security "max-age=31536000" always;

        location /api/ {
            proxy_pass         http://api/api/;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        }

        location /hubs/ {
            proxy_pass         http://api/hubs/;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host       $host;
        }

        location /uploads/ {
            proxy_pass http://api/uploads/;
        }

        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
        }

        location ~* /i18n/ {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
        }

        location ~* "\.[0-9a-f]{8,}\.(js|css)$" {
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
