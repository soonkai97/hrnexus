events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile           on;
    client_max_body_size 10m;   # allow photo uploads up to 10 MB
    gzip          on;
    gzip_types    text/plain text/css application/javascript application/json image/svg+xml;

    # ── Rate limiting — login brute-force protection ──────────────────────────
    # 10 requests/min per IP on auth endpoints; burst of 5 allowed
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;
    limit_req_status 429;

    upstream api {
        server api:8080;
    }

    # ── HTTP → HTTPS redirects ────────────────────────────────────────────────
    server {
        listen 80 default_server;
        return 301 https://$host$request_uri;
    }

    server {
        listen 8081;
        return 301 https://$host:8443$request_uri;
    }

    # ── Admin app — HTTPS 443 ─────────────────────────────────────────────────
    server {
        listen 443 ssl;
        http2 on;
        server_name _;
        root /usr/share/nginx/admin;
        index index.html;

        ssl_certificate     /etc/letsencrypt/live/hrnexus.duckdns.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/hrnexus.duckdns.org/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;

        # ── Security headers ─────────────────────────────────────────────────
        add_header Strict-Transport-Security  "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options     "nosniff" always;
        add_header X-Frame-Options            "DENY" always;
        add_header X-XSS-Protection           "1; mode=block" always;
        add_header Referrer-Policy            "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy         "geolocation=(), microphone=(), camera=()" always;

        # ── Maintenance mode ──────────────────────────────────────────────────
        error_page 503 /maintenance.html;
        location = /maintenance.html {
            root /usr/share/nginx;
            add_header Cache-Control "no-store" always;
        }

        location = /api/health {
            if (-f /tmp/maintenance/on) { return 503; }
            proxy_pass http://api/health;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # Rate-limited auth endpoints
        location /api/auth/ {
            if (-f /tmp/maintenance/on) { return 503; }
            limit_req zone=auth_limit burst=5 nodelay;
            proxy_pass         http://api/api/auth/;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        }

        location /api/ {
            if (-f /tmp/maintenance/on) { return 503; }
            proxy_pass         http://api/api/;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        }

        location /hubs/ {
            if (-f /tmp/maintenance/on) { return 503; }
            proxy_pass         http://api/hubs/;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host       $host;
        }

        # ^~ takes precedence over the static-image regex below, so uploaded
        # location images (/uploads/*.jpg) are proxied to the API instead of being
        # hijacked by the regex and 404'd against the Angular static root.
        location ^~ /uploads/ {
            proxy_pass http://api/uploads/;
        }

        location = /index.html {
            if (-f /tmp/maintenance/on) { return 503; }
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
            # nginx add_header does NOT inherit into a location with its own add_header, so the
            # security headers must be repeated here to cover the HTML document itself.
            add_header Strict-Transport-Security  "max-age=31536000; includeSubDomains" always;
            add_header X-Content-Type-Options     "nosniff" always;
            add_header X-Frame-Options            "DENY" always;
            add_header X-XSS-Protection           "1; mode=block" always;
            add_header Referrer-Policy            "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy         "geolocation=(), microphone=(), camera=()" always;
            # CSP is ENFORCED. 'unsafe-inline' is required for styles (Angular injects component styles
            # at runtime); scripts are strict 'self' (inlineCritical is disabled, so there are no inline
            # handlers). Verified zero violations across both portals before enabling.
            add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
        }

        location ~* /i18n/ {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
        }

        location ~* "\.[0-9a-f]{8,}\.(js|css)$" {
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        location ~* \.(js|css|json|webmanifest|ico|png|jpg|jpeg|webp|svg|woff2?|ttf|otf)$ {
            try_files $uri =404;
        }

        location / {
            if (-f /tmp/maintenance/on) { return 503; }
            try_files $uri $uri/ /index.html;
        }
    }

    # ── Staff app (PWA) — HTTPS 8443 ─────────────────────────────────────────
    server {
        listen 8443 ssl;
        http2 on;
        server_name _;
        root /usr/share/nginx/staff;
        index index.html;

        ssl_certificate     /etc/letsencrypt/live/hrnexus.duckdns.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/hrnexus.duckdns.org/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;

        # ── Security headers ─────────────────────────────────────────────────
        add_header Strict-Transport-Security  "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options     "nosniff" always;
        add_header X-Frame-Options            "DENY" always;
        add_header X-XSS-Protection           "1; mode=block" always;
        add_header Referrer-Policy            "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy         "geolocation=(), microphone=(), camera=()" always;

        # ── Maintenance mode ──────────────────────────────────────────────────
        error_page 503 /maintenance.html;
        location = /maintenance.html {
