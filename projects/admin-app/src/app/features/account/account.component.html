<div class="page-wrap">
  <div class="page-header">
    <h1 class="page-title">{{ 'account.title' | translate }}</h1>
  </div>
  <div class="account-layout">
    <p-card styleClass="profile-card">
      <h3 class="section-heading">{{ 'account.profileSection' | translate }}</h3>
      <div class="field">
        <label>{{ 'account.phoneNumber' | translate }}</label>
        <input pInputText type="text" [(ngModel)]="phoneNumber" placeholder="+60 12-345 6789" />
      </div>
      @if (profileError()) {
        <p-message severity="error" [text]="profileError()" styleClass="mb-3 w-full" />
      }
      <p-button [label]="savingProfile() ? ('common.saving' | translate) : ('account.saveProfile' | translate)"
                severity="primary" (click)="saveProfile()" [disabled]="savingProfile()" [loading]="savingProfile()" />
    </p-card>

    <p-card styleClass="password-card">
      <div class="password-card-info">
        <div class="password-card-label">{{ 'account.passwordSection' | translate }}</div>
        <div class="password-card-sub">{{ 'account.passwordDesc' | translate }}</div>
      </div>
      <p-button [label]="'account.changePassword' | translate" [text]="true" severity="secondary" routerLink="/account/change-password" />
    </p-card>
  </div>
</div>
