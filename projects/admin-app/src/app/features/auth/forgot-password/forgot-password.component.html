<div class="login-page">
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>

  <div class="login-controls">
    <nc-theme-toggle />
    <p-button icon="pi pi-globe" styleClass="login-lang-btn" [label]="lang.label()" [text]="true" severity="secondary" [attr.aria-label]="'shell.switchLanguage' | translate" (onClick)="langMenu.toggle($event)" />
    <p-menu #langMenu [model]="lang.menuItems()" [popup]="true" appendTo="body" />
  </div>

  <div class="login-card">
    <div class="brand">
      <span class="brand-icon"><i class="pi pi-users"></i></span>
      <h1 class="brand-name">HRNexus</h1>
      <p class="brand-sub">{{ 'auth.resetPassword' | translate }}</p>
    </div>

    @if (sent()) {
      <div class="success-box">
        <span class="success-icon"><i class="pi pi-bell"></i></span>
        <p>{{ 'auth.requestSent' | translate }}</p>
        <p class="hint">{{ 'auth.requestSentHint' | translate }}</p>
      </div>
      <p-button
        routerLink="/auth/login"
        [label]="'auth.backToSignIn' | translate"
        severity="primary"
        class="w-full"
        styleClass="w-full mt-3" />
    } @else {
      <p class="desc">{{ 'auth.forgotDesc' | translate }}</p>
      <div class="field">
        <label for="afp-staff-id"><span class="req">*</span> {{ 'auth.staffId' | translate }}</label>
        <input id="afp-staff-id" pInputText type="text" [(ngModel)]="staffId"
               class="w-full" [placeholder]="'auth.staffIdPlaceholder' | translate" autocomplete="off" />
      </div>
      @if (error()) {
        <p-message severity="error" styleClass="w-full mb-3">{{ error() }}</p-message>
      }
      <p-button
        [label]="loading() ? ('auth.notifying' | translate) : ('auth.notifyManager' | translate)"
        severity="primary"
        class="w-full"
        styleClass="w-full"
        [loading]="loading()"
        [disabled]="loading() || !staffId"
        (onClick)="submit()" />
      <div class="text-center mt-3">
        <a routerLink="/auth/login" class="back-link">{{ 'auth.backToSignIn' | translate }}</a>
      </div>
    }
  </div>
</div>
