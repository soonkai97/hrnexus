<div class="login-page">
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>

  <div class="login-controls">
    <nc-theme-toggle />
    <p-button styleClass="login-lang-btn" [label]="lang.current() === 'en' ? '中文' : 'EN'" [text]="true" severity="secondary" (onClick)="lang.toggle()" />
  </div>

  <div class="login-card">
    <div class="brand">
      <span class="brand-icon"><i class="pi pi-bolt"></i></span>
      <h1 class="brand-name">NightCrew</h1>
      <p class="brand-sub">{{ 'auth.managementPortal' | translate }}</p>
    </div>

    <div [formGroup]="form">
      <div class="field">
        <label>{{ 'auth.staffId' | translate }}</label>
        <input pInputText type="text" formControlName="staffId" placeholder="NC1001"
               class="w-full" readonly autocomplete="off" style="text-transform:uppercase"
               (mousedown)="removeReadonly($event)"
               (touchstart)="removeReadonly($event)"
               (keydown)="removeReadonly($event)" />
      </div>
      <div class="field">
        <label>{{ 'auth.password' | translate }}</label>
        <div class="pwd-wrap">
          <input pInputText [type]="showPwd() ? 'text' : 'password'" formControlName="password"
                 class="w-full" placeholder="••••••••" readonly autocomplete="new-password"
                 (mousedown)="removeReadonly($event)"
                 (touchstart)="removeReadonly($event)"
                 (keydown)="removeReadonly($event)"
                 (keydown.enter)="submit()" />
          <span class="eye-btn" role="button" tabindex="0"
                (click)="showPwd.set(!showPwd())"
                (keydown.enter)="showPwd.set(!showPwd())"
                (keydown.space)="showPwd.set(!showPwd())">
            {{ showPwd() ? 'Hide' : 'Show' }}
          </span>
        </div>
      </div>
      @if (error()) {
        <p-message severity="error" [text]="error()" styleClass="w-full mb-3" />
      }
      <p-button
        type="button"
        [label]="loading() ? ('auth.signingIn' | translate) : ('auth.signIn' | translate)"
        severity="primary"
        styleClass="w-full mt-1"
        [loading]="loading()"
        (onClick)="submit()" />
      <div style="text-align:center;margin-top:1rem">
        <a routerLink="/auth/forgot-password" class="forgot-link">{{ 'auth.forgotPassword' | translate }}</a>
      </div>
    </div>
  </div>
</div>
