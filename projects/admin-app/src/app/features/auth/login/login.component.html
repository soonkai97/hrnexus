<div class="login-page">
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>

  <div class="login-controls">
    <nc-theme-toggle />
  </div>

  <div class="login-card">
    <div class="brand">
      <span class="brand-icon"><i class="pi pi-users"></i></span>
      <h1 class="brand-name">HRNexus</h1>
      <p class="brand-sub">Management Portal</p>
    </div>

    <div [formGroup]="form">
      <div class="field">
        <label for="login-staff-id"><span class="req">*</span> Staff ID</label>
        <input id="login-staff-id" pInputText type="text" formControlName="staffId" placeholder="Your Staff ID"
               class="w-full" autocomplete="off" />
      </div>
      <div class="field">
        <label for="login-password"><span class="req">*</span> Password</label>
        <div class="pwd-wrap">
          <input id="login-password" pInputText [type]="showPwd() ? 'text' : 'password'" formControlName="password"
                 class="w-full" placeholder="Your password" autocomplete="current-password"
                 (keydown.enter)="submit()" />
          <span class="eye-btn" role="button" tabindex="0"
                [attr.aria-label]="(showPwd() ? 'Hide password' : 'Show password')"
                (click)="showPwd.set(!showPwd())"
                (keydown.enter)="showPwd.set(!showPwd())"
                (keydown.space)="showPwd.set(!showPwd())">
            <i [class]="showPwd() ? 'pi pi-eye-slash' : 'pi pi-eye'"></i>
          </span>
        </div>
      </div>
      @if (error()) {
        <p-message severity="error" [text]="error()" styleClass="w-full mb-3" />
      }
      <p-button
        type="button"
        [label]="loading() ? 'Signing in…' : 'Sign In'"
        severity="primary"
        class="w-full"
        styleClass="w-full mt-1"
        [loading]="loading()"
        [disabled]="loading() || form.invalid"
        (onClick)="submit()" />
      <div class="text-center mt-3">
        <a routerLink="/auth/forgot-password" class="forgot-link">Forgot password?</a>
      </div>
    </div>
  </div>
</div>
