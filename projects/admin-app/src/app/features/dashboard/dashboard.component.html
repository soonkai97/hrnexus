<div class="p-3 p-md-4">
  <div class="page-header d-flex flex-column flex-md-row align-items-start align-items-md-center justify-content-md-between flex-wrap gap-3">
    <h1 class="page-title">{{ 'dashboard.title' | translate }}</h1>
    @if (hubConnected()) {
      <p-tag severity="success"><span class="pulse-dot"></span> {{ 'dashboard.live' | translate }}</p-tag>
    } @else {
      <p-tag severity="secondary" [value]="'dashboard.connecting' | translate" />
    }
  </div>

  @if (loading()) {
    <div class="row row-cols-2 row-cols-lg-4 g-3 mb-4">
      <div class="col"><div class="skeleton-card d-flex flex-column gap-1">
        <p-skeleton width="55%" height="0.7rem" styleClass="mb-2" borderRadius="4px" />
        <p-skeleton width="45%" height="1.9rem" styleClass="mb-2" borderRadius="6px" />
        <p-skeleton width="75%" height="0.65rem" borderRadius="4px" />
      </div></div>
    </div>
  } @else if (stats(); as s) {
    <div class="row row-cols-2 row-cols-lg-4 g-3 mb-4">
      <div class="col">
        <p-card styleClass="stat-card accent-purple h-100">
          <span class="stat-label">{{ 'dashboard.totalStaff' | translate }}</span>
          <span class="stat-value">{{ s.totalStaff }}</span>
          <span class="stat-sub">{{ 'dashboard.activeStaffMembers' | translate }}</span>
        </p-card>
      </div>
    </div>
  }
</div>
