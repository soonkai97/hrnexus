<div class="pin-wrap">
  <p-card styleClass="pin-card">

    <div class="pin-icon">🔐</div>
    <h2 class="pin-title">Feature Management</h2>
    <p class="pin-sub">Enter your access PIN to continue. This area controls which features are available to this client.</p>

    <div class="pin-field">
      <input
        [type]="showPin() ? 'text' : 'password'"
        [(ngModel)]="pin"
        placeholder="Enter PIN"
        class="pin-input"
        [disabled]="loading() || isLockedOut"
        (keydown.enter)="submit()"
        autocomplete="off"
        autofocus />
      <p-button styleClass="pin-eye" [text]="true" severity="secondary" [label]="showPin() ? '🙈' : '👁'" (onClick)="showPin.update(v => !v)" />
    </div>

    @if (error()) {
      <div class="pin-error">
        {{ isLockedOut ? '🔒' : '⚠' }} {{ error() }}
      </div>
    }

    <p-button styleClass="pin-submit" [label]="loading() ? 'Verifying…' : 'Unlock'"
              [loading]="loading()" [disabled]="!pin || loading() || isLockedOut"
              (click)="submit()" />

    <p class="pin-hint">5 incorrect attempts triggers a 15-minute lockout.</p>

  </p-card>
</div>
