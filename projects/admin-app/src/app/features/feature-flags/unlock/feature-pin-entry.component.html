<div class="pin-wrap">
  <div class="pin-card">

    <div class="pin-icon-wrap">
      <i class="pi pi-lock pin-icon"></i>
    </div>

    <h2 class="pin-title">Feature Management</h2>
    <p class="pin-sub">Enter your access PIN to manage which features are available.</p>

    <div class="pin-field">
      <i class="pi pi-hashtag pin-field-icon"></i>
      <input
        pInputText
        [type]="showPin() ? 'text' : 'password'"
        [(ngModel)]="pin"
        placeholder="Enter PIN"
        class="pin-input"
        [disabled]="loading() || isLockedOut"
        (keydown.enter)="submit()"
        autocomplete="off"
        autofocus />
      <button class="pin-eye" type="button" (click)="showPin.update(v => !v)" [tabindex]="-1">
        <i [class]="showPin() ? 'pi pi-eye-slash' : 'pi pi-eye'"></i>
      </button>
    </div>

    @if (error()) {
      <div class="pin-error">
        <i [class]="isLockedOut ? 'pi pi-lock' : 'pi pi-exclamation-triangle'"></i>
        {{ error() }}
      </div>
    }

    <p-button
      label="Unlock"
      icon="pi pi-unlock"
      styleClass="pin-submit"
      severity="primary"
      [loading]="loading()"
      [disabled]="!pin || loading() || isLockedOut"
      (click)="submit()" />

    <p class="pin-hint"><i class="pi pi-info-circle"></i> 5 incorrect attempts triggers a 15-minute lockout.</p>

  </div>
</div>
