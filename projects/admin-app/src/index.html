<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- Build stamp — the Docker build replaces __BUILD_VERSION__ with YYYYMMDD.NN.
         Read synchronously by VersionService (no fetch), so it always reflects the running app. -->
    <meta name="build-version" content="__BUILD_VERSION__" />
    <title>HRNexus · Manager</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="manifest" href="manifest.webmanifest" />
    <!-- iOS home screen icon — must be explicit, iOS ignores manifest icons -->
    <link rel="apple-touch-icon" sizes="180x180" href="icons/icon-192x192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="HRNexus" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
