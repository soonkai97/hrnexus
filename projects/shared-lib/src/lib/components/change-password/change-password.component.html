<div class="cp-wrap">
  <h3 class="cp-title">Change Password</h3>
  <form [formGroup]="form" (ngSubmit)="submit()" autocomplete="off">
    <div class="field">
      <label>Current Password</label>
      <p-password formControlName="currentPassword" [feedback]="false" [toggleMask]="true"
                  placeholder="••••••••" autocomplete="new-password" styleClass="w-full" />
    </div>
    <div class="field">
      <label>New Password</label>
      <p-password formControlName="newPassword" [feedback]="false" [toggleMask]="true"
                  placeholder="Min. 8 characters" autocomplete="new-password" styleClass="w-full" />
    </div>
    <div class="field">
      <label>Confirm New Password</label>
      <p-password formControlName="confirmPassword" [feedback]="false" [toggleMask]="true"
                  placeholder="Repeat new password" autocomplete="new-password" styleClass="w-full" />
    </div>
    @if (error()) {
      <p-message severity="error" [text]="error()" styleClass="w-full mb-3" />
    }
    @if (success()) {
      <p-message severity="success" text="Password changed successfully." styleClass="w-full mb-3" />
    }
    <div class="cp-actions">
      <p-button
        type="submit"
        [label]="saving() ? 'Saving…' : 'Update Password'"
        severity="primary"
        [loading]="saving()"
        [disabled]="saving() || form.invalid" />
    </div>
  </form>
</div>
