<div class="cp-wrap">
  <h3 class="cp-title">{{ 'changePassword.title' | translate }}</h3>
  <form [formGroup]="form" (ngSubmit)="submit()" autocomplete="off">
    <div class="field">
      <label for="cp-current-password"><span class="req">*</span> {{ 'changePassword.current' | translate }}</label>
      <p-password inputId="cp-current-password" formControlName="currentPassword" [feedback]="false" [toggleMask]="true"
                  placeholder="••••••••" autocomplete="new-password" styleClass="w-full" />
    </div>
    <div class="field">
      <label for="cp-new-password"><span class="req">*</span> {{ 'changePassword.new' | translate }}</label>
      <p-password inputId="cp-new-password" formControlName="newPassword" [feedback]="false" [toggleMask]="true"
                  [placeholder]="'changePassword.newPlaceholder' | translate" autocomplete="new-password" styleClass="w-full" />
      <ul class="pwd-reqs" [attr.aria-label]="'changePassword.reqAria' | translate">
        <li [class.met]="pwdChecks.minLength">
          <i [class]="pwdChecks.minLength ? 'pi pi-check-circle' : 'pi pi-circle'"></i> {{ 'changePassword.reqMinLength' | translate }}
        </li>
      </ul>
    </div>
    <div class="field">
      <label for="cp-confirm-password"><span class="req">*</span> {{ 'changePassword.confirm' | translate }}</label>
      <p-password inputId="cp-confirm-password" formControlName="confirmPassword" [feedback]="false" [toggleMask]="true"
                  [placeholder]="'changePassword.confirmPlaceholder' | translate" autocomplete="new-password" styleClass="w-full" />
    </div>
    @if (error()) {
      <p-message severity="error" [text]="error()" styleClass="w-full mb-3" />
    }
    @if (success()) {
      <p-message severity="success" [text]="'changePassword.success' | translate" styleClass="w-full mb-3" />
    }
    <div class="cp-actions">
      <p-button
        type="submit"
        [label]="saving() ? ('changePassword.saving' | translate) : ('changePassword.update' | translate)"
        severity="primary"
        [loading]="saving()"
        [disabled]="saving() || form.invalid" />
    </div>
  </form>
</div>
