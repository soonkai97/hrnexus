<div class="cp-wrap">
  <h3 class="cp-title">Change Password</h3>
  <form [formGroup]="form" (ngSubmit)="submit()">
    <div class="field">
      <label>Current Password</label>
      <div class="pwd-wrap">
        <input [type]="showCurrent() ? 'text' : 'password'" formControlName="currentPassword" placeholder="••••••••" autocomplete="new-password" />
        <button type="button" class="eye-btn" (click)="showCurrent.set(!showCurrent())">
          {{ showCurrent() ? '🙈' : '👁' }}
        </button>
      </div>
    </div>
    <div class="field">
      <label>New Password</label>
      <div class="pwd-wrap">
        <input [type]="showNew() ? 'text' : 'password'" formControlName="newPassword" placeholder="Min. 8 characters" autocomplete="new-password" />
        <button type="button" class="eye-btn" (click)="showNew.set(!showNew())">
          {{ showNew() ? '🙈' : '👁' }}
        </button>
      </div>
    </div>
    <div class="field">
      <label>Confirm New Password</label>
      <div class="pwd-wrap">
        <input [type]="showConfirm() ? 'text' : 'password'" formControlName="confirmPassword" placeholder="Repeat new password" autocomplete="new-password" />
        <button type="button" class="eye-btn" (click)="showConfirm.set(!showConfirm())">
          {{ showConfirm() ? '🙈' : '👁' }}
        </button>
      </div>
    </div>
    @if (error()) {
      <div class="cp-error">⚠ {{ error() }}</div>
    }
    @if (success()) {
      <div class="cp-success">✓ Password changed successfully.</div>
    }
    <div class="cp-actions">
      <button type="submit" class="btn-primary" style="width:auto" [disabled]="saving() || form.invalid">
        @if (saving()) { <span class="nc-spinner sm"></span> }
        {{ saving() ? 'Saving…' : 'Update Password' }}
      </button>
    </div>
  </form>
</div>
