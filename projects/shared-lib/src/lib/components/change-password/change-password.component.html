<div class="cp-wrap">
  <h3 class="cp-title">Change Password</h3>
  <form [formGroup]="form" (ngSubmit)="submit()" autocomplete="off">
    <div class="field">
      <label>Current Password</label>
      <div class="pwd-wrap">
        <input pInputText [type]="showCurrent() ? 'text' : 'password'"
               formControlName="currentPassword" class="w-full"
               placeholder="••••••••" autocomplete="new-password" />
        <span class="eye-btn" role="button" tabindex="0"
              (click)="showCurrent.set(!showCurrent())"
              (keydown.enter)="showCurrent.set(!showCurrent())"
              (keydown.space)="showCurrent.set(!showCurrent())">
          <i [class]="showCurrent() ? 'pi pi-eye-slash' : 'pi pi-eye'"></i>
        </span>
      </div>
    </div>
    <div class="field">
      <label>New Password</label>
      <div class="pwd-wrap">
        <input pInputText [type]="showNew() ? 'text' : 'password'"
               formControlName="newPassword" class="w-full"
               placeholder="Min. 8 characters" autocomplete="new-password" />
        <span class="eye-btn" role="button" tabindex="0"
              (click)="showNew.set(!showNew())"
              (keydown.enter)="showNew.set(!showNew())"
              (keydown.space)="showNew.set(!showNew())">
          <i [class]="showNew() ? 'pi pi-eye-slash' : 'pi pi-eye'"></i>
        </span>
      </div>
    </div>
    <div class="field">
      <label>Confirm New Password</label>
      <div class="pwd-wrap">
        <input pInputText [type]="showConfirm() ? 'text' : 'password'"
               formControlName="confirmPassword" class="w-full"
               placeholder="Repeat new password" autocomplete="new-password" />
        <span class="eye-btn" role="button" tabindex="0"
              (click)="showConfirm.set(!showConfirm())"
              (keydown.enter)="showConfirm.set(!showConfirm())"
              (keydown.space)="showConfirm.set(!showConfirm())">
          <i [class]="showConfirm() ? 'pi pi-eye-slash' : 'pi pi-eye'"></i>
        </span>
      </div>
    </div>
    @if (error()) {
      <p-message severity="error" [text]="error()" styleClass="w-full mb-3" />
    }
    @if (success()) {
      <p-message severity="success" text="Password changed successfully." styleClass="w-full mb-3" />
    }
    <div class="cp-actions">
      <p-button
        type="submit"
        [label]="saving() ? 'Saving…' : 'Update Password'"
        severity="primary"
        [loading]="saving()"
        [disabled]="saving() || form.invalid" />
    </div>
  </form>
</div>
