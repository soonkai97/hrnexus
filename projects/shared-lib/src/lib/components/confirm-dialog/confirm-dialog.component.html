@if (svc.visible()) {
  <div class="overlay" (click)="svc.resolve(false)">
    <div class="dialog" (click)="$event.stopPropagation()">
      <h3 class="dialog-title">{{ svc.options().title || 'Confirm' }}</h3>
      <p class="dialog-msg">{{ svc.options().message }}</p>
      <div class="dialog-actions">
        <button class="btn-ghost" (click)="svc.resolve(false)">Cancel</button>
        <button [class]="svc.options().danger ? 'btn-danger' : 'btn-primary'"
                (click)="svc.resolve(true)">
          {{ svc.options().confirmLabel || 'Confirm' }}
        </button>
      </div>
    </div>
  </div>
}
