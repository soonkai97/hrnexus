<!-- Bell button -->
<button #bellBtn class="bell-btn" [class.has-unread]="svc.unreadCount() > 0"
        type="button" aria-label="Notifications" (click)="toggle()">
  🔔
  @if (svc.unreadCount() > 0) {
    <span class="badge" pBadge>{{ svc.unreadCount() > 9 ? '9+' : svc.unreadCount() }}</span>
  }
</button>

@if (open()) {
  <div class="notif-panel"
       [style.top.px]="panelTop"
       [style.right.px]="panelRight">

    <div class="panel-header">
      <span class="panel-title">Notifications</span>
      @if (svc.unreadCount() > 0) {
        <button class="mark-all" (click)="markAll()">Mark all read</button>
      }
    </div>

    <div class="panel-list">
      @if (svc.notifications().length === 0) {
        <div class="empty-notif">No notifications yet.</div>
      }
      @for (n of svc.notifications(); track n.id) {
        <div class="notif-item"
             [class.unread]="!n.isRead"
             [class.clickable]="!!routeFor(n)"
             (click)="onNotifClick(n)">
          <div class="notif-icon">{{ iconFor(n.type) }}</div>
          <div class="notif-body">
            <div class="notif-title">{{ n.title }}</div>
            <div class="notif-msg">{{ n.message }}</div>
            <div class="notif-time">{{ timeAgo(n.createdAt) }}</div>
          </div>
          @if (!n.isRead) { <span class="unread-dot"></span> }
        </div>
      }
    </div>
  </div>
}
