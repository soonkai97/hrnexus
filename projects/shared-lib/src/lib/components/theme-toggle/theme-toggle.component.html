<p-button
  styleClass="theme-toggle-btn"
  [icon]="themeSvc.theme() === 'dark' ? 'pi pi-moon' : 'pi pi-sun'"
  [text]="true"
  [pTooltip]="(themeSvc.theme() === 'dark' ? 'theme.toLight' : 'theme.toDark') | translate"
  tooltipPosition="bottom"
  [attr.aria-label]="'theme.toggle' | translate"
  (click)="themeSvc.toggle()" />
