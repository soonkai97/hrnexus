<div class="login-page">
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>

  <div class="login-controls">
    <nc-theme-toggle />
    <p-button styleClass="login-lang-btn" [label]="lang.current() === 'en' ? '中文' : 'EN'" [text]="true" severity="secondary" (onClick)="lang.toggle()" />
  </div>

  <div class="login-card">
    <div class="brand">
      <span class="brand-icon">◈</span>
      <h1 class="brand-name">NightCrew</h1>
      <p class="brand-sub">{{ 'auth.resetPassword' | translate }}</p>
    </div>

    @if (sent()) {
      <div class="success-box">
        <span class="success-icon">🔔</span>
        <p>{{ 'auth.requestSent' | translate }}</p>
        <p class="hint">{{ 'auth.requestSentHint' | translate }}</p>
      </div>
      <p-button
        routerLink="/auth/login"
        [label]="'auth.backToSignIn' | translate"
        severity="primary"
        styleClass="w-full mt-3" />
    } @else {
      <p class="desc">{{ 'auth.forgotDesc' | translate }}</p>
      <div class="field">
        <label>{{ 'auth.staffId' | translate }}</label>
        <input pInputText type="text" [(ngModel)]="staffId"
               class="w-full" placeholder="e.g. NC1001" autocomplete="off" />
      </div>
      @if (error()) {
        <p-message severity="error" [text]="error()" styleClass="w-full mb-3" />
      }
      <p-button
        [label]="loading() ? ('auth.notifying' | translate) : ('auth.notifyManager' | translate)"
        severity="primary"
        styleClass="w-full"
        [loading]="loading()"
        [disabled]="loading() || !staffId"
        (onClick)="submit()" />
      <div style="text-align:center;margin-top:1rem">
        <a routerLink="/auth/login" class="back-link">{{ 'auth.backToSignIn' | translate }}</a>
      </div>
    }
  </div>
</div>
