<div class="login-page">
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>

  <div class="login-controls">
    <nc-theme-toggle />
  </div>

  <div class="login-card">
    <div class="brand">
      <span class="brand-icon"><i class="pi pi-user"></i></span>
      <h1 class="brand-name">HRNexus</h1>
      <p class="brand-sub">Reset Password</p>
    </div>

    @if (sent()) {
      <div class="success-box">
        <span class="success-icon"><i class="pi pi-bell"></i></span>
        <p>Your request has been sent to your manager.</p>
        <p class="hint">They will contact you with a new password. Please wait for them to reach out.</p>
      </div>
      <p-button
        routerLink="/auth/login"
        label="← Back to Sign In"
        severity="primary"
        class="w-full"
        styleClass="w-full mt-3" />
    } @else {
      <p class="desc">Enter your Staff ID and your manager will be notified to reset your password.</p>
      <div class="field">
        <label for="fp-staff-id"><span class="req">*</span> Staff ID</label>
        <input id="fp-staff-id" pInputText type="text" [(ngModel)]="staffId"
               class="w-full" placeholder="Your Staff ID" autocomplete="off" />
      </div>
      @if (error()) {
        <p-message severity="error" [text]="error()" styleClass="w-full mb-3" />
      }
      <p-button
        [label]="loading() ? 'Sending…' : 'Notify Manager'"
        severity="primary"
        class="w-full"
        styleClass="w-full"
        [loading]="loading()"
        [disabled]="loading() || !staffId"
        (onClick)="submit()" />
      <div class="text-center mt-3">
        <a routerLink="/auth/login" class="back-link">← Back to Sign In</a>
      </div>
    }
  </div>
</div>
