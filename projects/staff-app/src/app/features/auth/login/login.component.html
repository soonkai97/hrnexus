<div class="login-page">
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>

  <div class="login-controls">
    <nc-theme-toggle />
    <p-button icon="pi pi-globe" styleClass="login-lang-btn" [label]="lang.current() === 'en' ? 'EN' : '中文'" [text]="true" severity="secondary" [attr.aria-label]="lang.current() === 'en' ? 'Switch to Chinese' : 'Switch to English'" (onClick)="lang.toggle()" />
  </div>

  <div class="login-card">
    <div class="brand">
      <span class="brand-icon"><i class="pi pi-user"></i></span>
      <h1 class="brand-name">HRNexus</h1>
      <p class="brand-sub">{{ 'auth.staffPortal' | translate }}</p>
    </div>

    <div [formGroup]="form">
      <div class="field">
        <label for="login-staff-id">{{ 'auth.staffId' | translate }}</label>
        <input id="login-staff-id" pInputText type="text" formControlName="staffId" placeholder="Your Staff ID"
               class="w-full" readonly autocomplete="off"
               (mousedown)="removeReadonly($event)"
               (touchstart)="removeReadonly($event)"
               (keydown)="removeReadonly($event)" />
      </div>
      <div class="field">
        <label for="login-password">{{ 'auth.password' | translate }}</label>
        <div class="pwd-wrap">
          <input id="login-password" pInputText [type]="showPwd() ? 'text' : 'password'" formControlName="password"
                 class="w-full" placeholder="Your password" readonly autocomplete="new-password"
                 (mousedown)="removeReadonly($event)"
                 (touchstart)="removeReadonly($event)"
                 (keydown)="removeReadonly($event)"
                 (keydown.enter)="submit()" />
          <span class="eye-btn" role="button" tabindex="0"
                [attr.aria-label]="showPwd() ? 'Hide password' : 'Show password'"
                (click)="showPwd.set(!showPwd())"
                (keydown.enter)="showPwd.set(!showPwd())"
                (keydown.space)="showPwd.set(!showPwd())">
            <i [class]="showPwd() ? 'pi pi-eye-slash' : 'pi pi-eye'"></i>
          </span>
        </div>
      </div>
      @if (error()) {
        <p-message severity="error" [text]="error()" styleClass="w-full mb-3" />
      }
      <p-button
        type="button"
        [label]="loading() ? ('auth.signingIn' | translate) : ('auth.signIn' | translate)"
        severity="primary"
        class="w-full"
        styleClass="w-full mt-1"
        [loading]="loading()"
        (onClick)="submit()" />
      <div class="text-center mt-3">
        <a routerLink="/auth/forgot-password" class="forgot-link">{{ 'auth.forgotPassword' | translate }}</a>
      </div>
    </div>
  </div>
</div>
