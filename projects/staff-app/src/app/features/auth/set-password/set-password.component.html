<nc-theme-toggle />
<div class="login-page">
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>

  <div class="login-card">
    <div class="brand">
      <span class="brand-icon"><i class="pi pi-key"></i></span>
      <h1 class="brand-name">NightCrew</h1>
      <p class="brand-sub">{{ 'auth.setNewPassword' | translate }}</p>
    </div>

    <div class="info-box">
      <span><i class="pi pi-info-circle"></i></span>
      {{ 'auth.tempPasswordInfo' | translate }}
    </div>

    <div class="field">
      <label>{{ 'auth.newPassword' | translate }}</label>
      <div class="pwd-wrap">
        <input pInputText [type]="showNew() ? 'text' : 'password'" [(ngModel)]="newPwd"
               class="w-full" [placeholder]="showNew() ? ('auth.minCharsHint' | translate) : ''"
               autocomplete="new-password" />
        <span class="eye-btn" role="button" tabindex="0"
              [attr.aria-label]="showNew() ? 'Hide password' : 'Show password'"
              (click)="showNew.set(!showNew())"
              (keydown.enter)="showNew.set(!showNew())"
              (keydown.space)="showNew.set(!showNew())">
          <i [class]="showNew() ? 'pi pi-eye-slash' : 'pi pi-eye'"></i>
        </span>
      </div>
    </div>

    <div class="field">
      <label>{{ 'auth.confirmPassword' | translate }}</label>
      <div class="pwd-wrap">
        <input pInputText [type]="showConfirm() ? 'text' : 'password'" [(ngModel)]="confirmPwd"
               class="w-full" [placeholder]="showConfirm() ? ('auth.confirmPasswordHint' | translate) : ''"
               autocomplete="new-password" />
        <span class="eye-btn" role="button" tabindex="0"
              [attr.aria-label]="showConfirm() ? 'Hide password' : 'Show password'"
              (click)="showConfirm.set(!showConfirm())"
              (keydown.enter)="showConfirm.set(!showConfirm())"
              (keydown.space)="showConfirm.set(!showConfirm())">
          <i [class]="showConfirm() ? 'pi pi-eye-slash' : 'pi pi-eye'"></i>
        </span>
      </div>
    </div>

    @if (error()) {
      <p-message severity="error" [text]="error()" styleClass="w-full mb-3" />
    }

    <p-button
      [label]="loading() ? ('common.saving' | translate) : ('auth.setPassword' | translate)"
      severity="primary"
      styleClass="w-full"
      [loading]="loading()"
      [disabled]="loading() || !newPwd || !confirmPwd"
      (onClick)="submit()" />
  </div>
</div>
