<nc-theme-toggle />
<div class="login-page">
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>

  <div class="login-card">
    <div class="brand">
      <span class="brand-icon">🔑</span>
      <h1 class="brand-name">NightCrew</h1>
      <p class="brand-sub">Set New Password</p>
    </div>

    <div class="info-box">
      <span>ℹ</span>
      You're using a temporary password. Please set a new password to continue.
    </div>

    <div class="field">
      <label>New Password</label>
      <div class="pwd-wrap">
        <input [type]="showNew() ? 'text' : 'password'" [(ngModel)]="newPwd"
               placeholder="Min. 8 characters" autocomplete="new-password" />
        <button type="button" class="eye-btn" (click)="showNew.set(!showNew())">
          {{ showNew() ? '🙈' : '👁' }}
        </button>
      </div>
    </div>

    <div class="field">
      <label>Confirm Password</label>
      <div class="pwd-wrap">
        <input [type]="showConfirm() ? 'text' : 'password'" [(ngModel)]="confirmPwd"
               placeholder="Re-enter new password" autocomplete="new-password" />
        <button type="button" class="eye-btn" (click)="showConfirm.set(!showConfirm())">
          {{ showConfirm() ? '🙈' : '👁' }}
        </button>
      </div>
    </div>

    @if (error()) {
      <div class="login-error"><span>⚠</span> {{ error() }}</div>
    }

    <button class="btn-primary btn-block" (click)="submit()" [disabled]="loading() || !newPwd || !confirmPwd">
      @if (loading()) { <span class="nc-spinner sm"></span> }
      {{ loading() ? 'Saving…' : 'Set Password' }}
    </button>
  </div>
</div>
